<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#141B3C" />
    <meta name="description" content="Pera — track your money, online or offline." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Pera</title>
    <script>
      // Apply theme before paint to avoid a flash.
      try {
        var t = localStorage.getItem('pera-theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot" style="min-height:100vh;display:grid;place-items:center;background:#141B3C;color:#fff;font-family:system-ui">
        <div style="text-align:center"><div style="font-size:40px">₱</div><div style="opacity:.7;margin-top:8px">Opening Pera…</div></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
